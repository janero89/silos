<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador de Silos de Pienso</title>
<style>
  :root{
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --ink: #2B2A28;
    --muted: #6B6863;
    --line: #DEDAD1;
    --accent: #2F6E5C;
    font-family: "Iowan Old Style", "Georgia", serif;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 20px 80px;
  }

  .wrap{ max-width: 1500px; margin: 0 auto; }

  header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }

  h1{ font-size: 26px; font-weight: 600; letter-spacing: 0.2px; margin: 0; }

  header p{
    margin: 0; color: var(--muted); font-size: 14px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 24px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  .panel h2{
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 14px 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .top-row{
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .field-inline label{
    display: block; font-size: 13px; margin-bottom: 6px; color: var(--ink);
  }
  .field-inline input[type="number"]{
    width: 90px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 3px;
    font-size: 14px; background: #FBFAF7;
  }

  .btn{
    padding: 10px 18px;
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    border-radius: 3px; font-size: 14px; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn:hover{ opacity: 0.85; }
  .btn.secondary{ background: transparent; color: var(--ink); }

  table.silo-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.silo-table th{
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
    text-transform: none;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
  }
  table.silo-table td{
    padding: 5px 8px;
    border-bottom: 1px solid #EFEDE7;
  }
  table.silo-table input{
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 13px;
    background: #FBFAF7;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  table.silo-table td.col-id input{ width: 56px; }
  table.silo-table td.col-rings input,
  table.silo-table td.col-fill input,
  table.silo-table td.col-cap input{ width: 76px; }

  .stage{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px 16px;
  }

  .capture-title{
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 18px;
  }

  #capture-area{
    background: var(--panel);
    padding: 10px;
  }

  .silos-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
  }

  .silo-card{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .silo-card .silo-name{
    font-size: 15px; font-weight: 600; margin-bottom: 2px;
  }
  .silo-card .silo-sub{
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 10px; color: var(--muted); margin-bottom: 8px;
  }

  .silo-card .fill-readout{
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px; width: 100%;
  }
  .silo-card .fill-number{
    font-size: 18px; font-weight: 700;
    font-family: "Helvetica Neue", Arial, sans-serif; min-width: 40px;
  }
  .silo-card .fill-bar-track{
    flex: 1; height: 8px; border-radius: 4px;
    background: #EAE6DC; border: 1px solid var(--line); overflow: hidden;
  }
  .silo-card .fill-bar-fill{ height: 100%; border-radius: 4px 0 0 4px; }

  .silo-card .capacity-line{
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 10px; color: var(--muted); margin-top: 4px;
  }

  footer{
    text-align: center; margin-top: 40px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; color: var(--muted);
  }

  @media print{
    body{ padding: 0; background: #fff; }
    .panel, header p, footer{ display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="farmTitle">Mi Granja</h1>
    </div>
  </header>

  <div class="panel">
    <div class="top-row">
      <div class="field-inline" style="min-width:220px;">
        <label for="farmName">Nombre de la granja</label>
        <input type="text" id="farmName" value="Mi Granja" style="width:100%;" />
      </div>
      <div class="field-inline">
        <label for="numSilos">Número de silos</label>
        <input type="number" id="numSilos" value="6" min="1" max="20" />
      </div>
      <button class="btn" id="exportBtn">Exportar todo a PDF</button>
      <button class="btn secondary" id="printBtn">Imprimir</button>
    </div>

    <h2>Ajustes por silo</h2>
    <table class="silo-table">
      <thead>
        <tr>
          <th>Nº</th>
          <th>Nombre</th>
          <th>Anillos</th>
          <th>% Lleno</th>
          <th>Capacidad (t) — opcional</th>
        </tr>
      </thead>
      <tbody id="siloRows"></tbody>
    </table>
  </div>

  <div class="stage">
    <div id="capture-area">
      <div class="capture-title" id="captureTitle">Mi Granja</div>
      <div class="silos-grid" id="silosGrid"></div>
    </div>
  </div>

  <footer>Generado localmente en el navegador — sin envío de datos a ningún servidor.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);

  const numSilosInput = $('numSilos');
  const siloRows = $('siloRows');
  const captureArea = $('capture-area');
  const silosGrid = $('silosGrid');
  const captureTitle = $('captureTitle');
  const farmTitle = $('farmTitle');
  const farmNameInput = $('farmName');
  const exportBtn = $('exportBtn');
  const printBtn = $('printBtn');

  let configs = [];

  function defaultConfig(idx){
    return {
      id: String(idx + 1),
      name: 'Silo ' + (idx + 1),
      rings: 4,
      fill: 50,
      capacity: ''
    };
  }

  function syncConfigsLength(n){
    if (n > configs.length){
      for (let i = configs.length; i < n; i++){
        configs.push(defaultConfig(i));
      }
    } else if (n < configs.length){
      configs = configs.slice(0, n);
    }
  }

  function grainColor(pct){
    if (pct <= 15) return '#C0472F';
    if (pct <= 45) return '#D9A24E';
    return '#C88A3D';
  }

  function buildFillPath(fillTopY, x1, x2, xCenter, yBodyBottom, tipY, bodyWidth, coneHeight){
    if (fillTopY >= tipY) return '';
    if (fillTopY >= yBodyBottom){
      const ratio = (tipY - fillTopY) / coneHeight;
      const halfW = (bodyWidth / 2) * ratio;
      return `M ${xCenter - halfW} ${fillTopY} L ${xCenter + halfW} ${fillTopY} L ${xCenter} ${tipY} Z`;
    }
    const top = Math.max(fillTopY, 0);
    return `M ${x1} ${top} L ${x2} ${top} L ${x2} ${yBodyBottom} L ${xCenter} ${tipY} L ${x1} ${yBodyBottom} Z`;
  }

  function buildSiloSVG(cfg, gradId){
    const numRings = Math.max(1, parseInt(cfg.rings, 10) || 1);
    const fillPct = Math.min(100, Math.max(0, parseInt(cfg.fill, 10) || 0));

    const bodyWidth = 120;
    const ringH = 26;
    const bodyHeight = ringH * numRings;
    const coneH = 60;
    const domeH = bodyWidth * 0.18;
    const marginTop = domeH + 10;
    const marginBottom = 14;
    const totalHeight = bodyHeight + coneH;
    const svgWidth = bodyWidth + 50;
    const svgHeight = totalHeight + marginTop + marginBottom;

    const xCenter = svgWidth / 2;
    const x1 = xCenter - bodyWidth / 2;
    const x2 = xCenter + bodyWidth / 2;
    const yBodyTop = marginTop;
    const yBodyBottom = yBodyTop + bodyHeight;
    const tipY = yBodyBottom + coneH;

    const totalFillHeight = totalHeight * (fillPct / 100);
    const fillTopY = tipY - totalFillHeight;
    const fillPath = buildFillPath(fillTopY, x1, x2, xCenter, yBodyBottom, tipY, bodyWidth, coneH);
    const color = grainColor(fillPct);

    const bodyOutline = `M ${x1} ${yBodyTop} L ${x2} ${yBodyTop} L ${x2} ${yBodyBottom} L ${xCenter} ${tipY} L ${x1} ${yBodyBottom} Z`;
    const domePath = `M ${x1} ${yBodyTop} A ${bodyWidth / 2} ${domeH} 0 0 1 ${x2} ${yBodyTop} L ${x2} ${yBodyTop} L ${x1} ${yBodyTop} Z`;

    let ringLines = '';
    for (let i = 1; i < numRings; i++){
      const y = yBodyTop + i * ringH;
      ringLines += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#3A3835" stroke-width="1.6" opacity="0.85"/>`;
    }

    let corrugation = '';
    const step = 5;
    for (let y = yBodyTop + step; y < yBodyBottom; y += step){
      corrugation += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#A9A79F" stroke-width="0.5" opacity="0.4"/>`;
    }
    for (let y = yBodyBottom + step; y < tipY; y += step){
      const ratio = (tipY - y) / coneH;
      const hw = (bodyWidth / 2) * ratio;
      corrugation += `<line x1="${xCenter - hw}" y1="${y}" x2="${xCenter + hw}" y2="${y}" stroke="#A9A79F" stroke-width="0.5" opacity="0.35"/>`;
    }

    const siloId = cfg.id || '';

    const svg = `
      <svg viewBox="0 0 ${svgWidth} ${svgHeight}" width="100%" height="${Math.min(280, svgHeight)}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="steelGrad-${gradId}" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#F1F0ED"/>
            <stop offset="45%" stop-color="#DCDAD5"/>
            <stop offset="100%" stop-color="#B0AEA8"/>
          </linearGradient>
          <linearGradient id="domeGrad-${gradId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#D6D4CE"/>
          </linearGradient>
        </defs>
        <path d="${bodyOutline}" fill="url(#steelGrad-${gradId})" stroke="#5A5D62" stroke-width="1.5"/>
        ${fillPath ? `<path d="${fillPath}" fill="${color}" stroke="none" opacity="0.92"/>` : ''}
        ${corrugation}
        ${ringLines}
        <path d="${domePath}" fill="url(#domeGrad-${gradId})" stroke="#5A5D62" stroke-width="1.5"/>
        <line x1="${x1}" y1="${yBodyTop}" x2="${x1}" y2="${yBodyBottom}" stroke="#5A5D62" stroke-width="1"/>
        <line x1="${x2}" y1="${yBodyTop}" x2="${x2}" y2="${yBodyBottom}" stroke="#5A5D62" stroke-width="1"/>
        ${siloId ? `<text x="${xCenter}" y="${yBodyBottom + coneH * 0.45}" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="${Math.max(13, bodyWidth * 0.14)}" font-weight="700" fill="#2B2A28">${siloId}</text>` : ''}
      </svg>
    `;
    return { svg, color, fillPct };
  }

  function renderRows(){
    siloRows.innerHTML = configs.map((cfg, i) => `
      <tr data-idx="${i}">
        <td class="col-id"><input class="cell-id" value="${cfg.id}" /></td>
        <td><input class="cell-name" value="${cfg.name}" /></td>
        <td class="col-rings"><input class="cell-rings" type="number" min="1" max="10" value="${cfg.rings}" /></td>
        <td class="col-fill"><input class="cell-fill" type="number" min="0" max="100" value="${cfg.fill}" /></td>
        <td class="col-cap"><input class="cell-cap" type="number" min="0" step="0.5" placeholder="—" value="${cfg.capacity}" /></td>
      </tr>
    `).join('');
  }

  function renderGrid(){
    silosGrid.innerHTML = configs.map((cfg, i) => {
      const { svg, color, fillPct } = buildSiloSVG(cfg, i);
      const capacityT = cfg.capacity !== '' && cfg.capacity !== null ? parseFloat(cfg.capacity) : null;
      const capLine = capacityT
        ? `${(capacityT * fillPct / 100).toFixed(1)} t de ${capacityT.toFixed(1)} t`
        : '';
      return `
        <div class="silo-card">
          <div class="silo-name">${cfg.name || ('Silo ' + cfg.id)}</div>
          <div class="silo-sub">${cfg.rings} anillo${cfg.rings > 1 ? 's' : ''}${capacityT ? ' · ' + capacityT.toFixed(1) + ' t' : ''}</div>
          ${svg}
          <div class="fill-readout">
            <div class="fill-number">${fillPct}%</div>
            <div class="fill-bar-track"><div class="fill-bar-fill" style="width:${fillPct}%; background:${color};"></div></div>
          </div>
          ${capLine ? `<div class="capacity-line">${capLine}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  function renderAll(){
    renderRows();
    renderGrid();
  }

  farmNameInput.addEventListener('input', () => {
    const name = farmNameInput.value || 'Mi Granja';
    farmTitle.textContent = name;
    captureTitle.textContent = name;
  });

  numSilosInput.addEventListener('input', () => {
    const n = Math.max(1, Math.min(30, parseInt(numSilosInput.value, 10) || 1));
    syncConfigsLength(n);
    renderAll();
  });

  siloRows.addEventListener('input', (e) => {
    const tr = e.target.closest('tr');
    if (!tr) return;
    const idx = parseInt(tr.dataset.idx, 10);
    const cfg = configs[idx];
    if (!cfg) return;
    if (e.target.classList.contains('cell-id')) cfg.id = e.target.value;
    else if (e.target.classList.contains('cell-name')) cfg.name = e.target.value;
    else if (e.target.classList.contains('cell-rings')) cfg.rings = parseInt(e.target.value, 10) || 1;
    else if (e.target.classList.contains('cell-fill')) cfg.fill = parseInt(e.target.value, 10) || 0;
    else if (e.target.classList.contains('cell-cap')) cfg.capacity = e.target.value;
    renderGrid();
  });

  printBtn.addEventListener('click', () => window.print());

  exportBtn.addEventListener('click', async () => {
    const original = exportBtn.textContent;
    exportBtn.textContent = 'Generando PDF…';
    exportBtn.disabled = true;
    try {
      const canvas = await html2canvas(captureArea, { backgroundColor: '#FFFFFF', scale: 2 });
      const { jsPDF } = window.jspdf;
      const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
      const pdf = new jsPDF({ orientation, unit: 'pt', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const ratio = pageWidth / canvas.width;
      const scaledHeight = canvas.height * ratio;

      if (scaledHeight <= pageHeight){
        const y = (pageHeight - scaledHeight) / 2;
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, y, pageWidth, scaledHeight);
      } else {
        const pageCanvasHeightPx = pageHeight / ratio;
        let renderedHeight = 0;
        let first = true;
        while (renderedHeight < canvas.height){
          const sliceHeightPx = Math.min(pageCanvasHeightPx, canvas.height - renderedHeight);
          const sliceCanvas = document.createElement('canvas');
          sliceCanvas.width = canvas.width;
          sliceCanvas.height = sliceHeightPx;
          const ctx = sliceCanvas.getContext('2d');
          ctx.drawImage(canvas, 0, renderedHeight, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
          const imgData = sliceCanvas.toDataURL('image/png');
          if (!first) pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, sliceHeightPx * ratio);
          renderedHeight += sliceHeightPx;
          first = false;
        }
      }
      pdf.save('silos_pienso.pdf');
    } catch (err) {
      console.error(err);
      alert('No se pudo generar el PDF. Revisa la conexión (se necesitan las librerías de cdnjs.cloudflare.com).');
    } finally {
      exportBtn.textContent = original;
      exportBtn.disabled = false;
    }
  });

  // inicializar con el valor por defecto (6 silos)
  syncConfigsLength(parseInt(numSilosInput.value, 10) || 6);
  renderAll();
})();
</script>
</body>
</html>
